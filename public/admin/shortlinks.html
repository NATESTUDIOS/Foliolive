<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shortlinks — Folio Admin</title>
<meta name="theme-color" content="#0a0c10">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://foliostudios.vercel.app/icons/icon.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#0a0c10;
  --surface:#0f1218;
  --surface-2:#151922;
  --surface-3:#1a1f2a;
  --primary:#F59E0B;
  --primary-hover:#fbbf24;
  --primary-glow:rgba(245,158,11,0.4);
  --primary-soft:rgba(245,158,11,0.14);
  --text:#e8ecf1;
  --text-2:rgba(232,236,241,0.72);
  --text-3:rgba(232,236,241,0.44);
  --glass:rgba(255,255,255,0.05);
  --glass-border:rgba(255,255,255,0.09);
  --divider:rgba(255,255,255,0.08);
  --danger:#EF4444;
  --danger-soft:rgba(239,68,68,0.14);
  --warning:#D97706;
  --warning-soft:rgba(217,119,6,0.16);
  --success:#10B981;
  --success-soft:rgba(16,185,129,0.14);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body{
  background:
    radial-gradient(circle at 50% -20%, rgba(245,158,11,0.10) 0%, transparent 55%),
    radial-gradient(circle at 100% 100%, rgba(168,85,247,0.05) 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--primary);text-decoration:none}
svg{display:block}
.hidden{display:none!important}

/* Layout */
.app{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:100vh;
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
}

/* Sidebar */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--glass-border);
  padding:20px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform 0.3s var(--ease)}
  .sidebar.open{transform:translateX(0)}
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px 20px;
  border-bottom:1px solid var(--divider);
  margin-bottom:12px;
}
.brand img{width:32px;height:32px;border-radius:8px}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-0.02em}
.brand-sub{font-size:10px;color:var(--text-3);font-weight:600;letter-spacing:0.05em;text-transform:uppercase}

.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:8px;
  color:var(--text-2);
  font-size:13px;
  font-weight:600;
  transition:all 0.15s var(--ease);
  text-align:left;
  width:100%;
}
.nav-item:hover{background:var(--glass);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary)}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item .badge{
  margin-left:auto;
  padding:1px 6px;
  border-radius:4px;
  font-size:9.5px;
  font-weight:800;
  background:var(--primary);
  color:#0a0c10;
  min-width:18px;
  text-align:center;
}

.nav-section{
  font-size:9.5px;
  font-weight:800;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:0.08em;
  padding:16px 12px 6px;
}

/* Main */
.main{
  padding:24px 32px;
  max-width:1400px;
  width:100%;
  overflow-y:auto;
}
@media (max-width:900px){
  .main{padding:16px}
  .mobile-header{display:flex!important}
}
.mobile-header{
  display:none;
  align-items:center;
  gap:12px;
  padding:12px 0 16px;
  border-bottom:1px solid var(--divider);
  margin-bottom:16px;
}
.mobile-header button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--glass);border:1px solid var(--glass-border)}
.mobile-header button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}

.page-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:24px;
  flex-wrap:wrap;
}
.page-title{
  font-size:26px;
  font-weight:800;
  color:var(--text);
  letter-spacing:-0.03em;
  line-height:1.1;
  margin-bottom:4px;
}
.page-sub{
  font-size:13px;
  color:var(--text-3);
  font-weight:500;
  line-height:1.5;
  max-width:600px;
}
.page-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
@media (max-width:600px){
  .page-title{font-size:20px}
  .page-actions{width:100%}
}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 16px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  transition:all 0.15s var(--ease);
  border:1px solid transparent;
  min-height:36px;
  white-space:nowrap;
}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn-primary{background:var(--primary);color:#0a0c10}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--glass-border)}
.btn-secondary:hover{background:var(--surface-3);border-color:var(--primary-glow)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(239,68,68,0.3)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--glass);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px;min-height:30px}
.btn-sm svg{width:12px;height:12px}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* Cards */
.card{
  background:var(--surface-2);
  border:1px solid var(--glass-border);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:16px;
}
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 20px;
  border-bottom:1px solid var(--divider);
  flex-wrap:wrap;
}
.card-title{
  font-size:14px;
  font-weight:800;
  color:var(--text);
  letter-spacing:-0.01em;
  display:flex;
  align-items:center;
  gap:8px;
}
.card-title svg{width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card-body{padding:20px}
.card-body.tight{padding:0}

/* Stats */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:24px;
}
.stat-card{
  background:var(--surface-2);
  border:1px solid var(--glass-border);
  border-radius:12px;
  padding:16px 18px;
  position:relative;
  overflow:hidden;
}
.stat-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,var(--primary),transparent);
  opacity:0.6;
}
.stat-label{
  font-size:10px;
  font-weight:800;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:8px;
}
.stat-value{
  font-size:28px;
  font-weight:800;
  color:var(--text);
  letter-spacing:-0.04em;
  line-height:1;
  margin-bottom:6px;
  font-variant-numeric:tabular-nums;
}
.stat-hint{
  font-size:11px;
  color:var(--text-3);
  font-weight:500;
}
.stat-hint.up{color:var(--success)}
.stat-hint.down{color:var(--danger)}

/* Table */
.table-wrap{
  overflow-x:auto;
  border-radius:0 0 12px 12px;
}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface-3)}
th{
  text-align:left;
  padding:12px 16px;
  font-size:10px;
  font-weight:800;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:0.06em;
  white-space:nowrap;
  border-bottom:1px solid var(--divider);
}
td{
  padding:14px 16px;
  border-bottom:1px solid var(--divider);
  color:var(--text-2);
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--glass)}
td.mono{font-family:var(--font-mono);font-size:11.5px;color:var(--text)}
td.strong{font-weight:700;color:var(--text)}
td.url-cell{max-width:300px}
td.url-cell a{color:var(--text-2);text-decoration:none;font-family:var(--font-mono);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.url-cell a:hover{color:var(--primary);text-decoration:underline}
td.actions{white-space:nowrap;text-align:right}
td.actions .btn{margin-left:4px}

/* Chips */
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:4px;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.04em;
}
.chip.primary{background:var(--primary-soft);color:var(--primary)}
.chip.success{background:var(--success-soft);color:var(--success)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.warning{background:var(--warning-soft);color:var(--warning)}
.chip.neutral{background:var(--glass);color:var(--text-3)}
.chip svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2.4}

/* Inputs */
.input{
  width:100%;
  padding:10px 14px;
  background:var(--bg);
  border:1px solid var(--glass-border);
  border-radius:8px;
  color:var(--text);
  font-size:13px;
  font-family:inherit;
  outline:none;
  transition:border-color 0.15s;
}
.input:focus{border-color:var(--primary)}
.input.mono{font-family:var(--font-mono);font-size:12px}
.input::placeholder{color:var(--text-3)}

.search-bar{
  display:flex;
  gap:8px;
  padding:12px 16px;
  border-bottom:1px solid var(--divider);
  flex-wrap:wrap;
  background:var(--surface);
}
.search-bar .input{flex:1;min-width:200px}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(10,12,16,0.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--surface-2);
  border:1px solid var(--glass-border);
  border-radius:14px;
  max-width:560px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
}
.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 24px;
  border-bottom:1px solid var(--divider);
}
.modal-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-0.02em}
.modal-close{
  width:32px;height:32px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
}
.modal-close:hover{background:var(--glass);color:var(--text)}
.modal-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}
.modal-body{padding:20px 24px}
.modal-footer{
  display:flex;
  gap:8px;
  padding:16px 24px;
  border-top:1px solid var(--divider);
  justify-content:flex-end;
  flex-wrap:wrap;
}

.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field-label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-bottom:6px;
}
.field-hint{
  font-size:11px;
  color:var(--text-3);
  margin-top:6px;
  line-height:1.5;
}
.field-error{
  font-size:11px;
  color:var(--danger);
  margin-top:6px;
  font-weight:600;
}

/* Toast */
.toast-container{
  position:fixed;
  bottom:24px;right:24px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:200;
  max-width:380px;
}
.toast{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border-radius:10px;
  background:var(--surface-2);
  border:1px solid var(--glass-border);
  font-size:13px;
  font-weight:600;
  color:var(--text);
  box-shadow:0 12px 40px rgba(0,0,0,0.4);
  animation:slideIn 0.3s var(--ease);
}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-color:rgba(16,185,129,0.4)}
.toast.success svg{color:var(--success)}
.toast.error{border-color:rgba(239,68,68,0.4)}
.toast.error svg{color:var(--danger)}
.toast.warning{border-color:rgba(217,119,6,0.4)}
.toast.warning svg{color:var(--warning)}
.toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;flex-shrink:0}

/* Empty */
.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px 24px;
  gap:12px;
}
.empty-icon{
  width:56px;height:56px;
  border-radius:14px;
  background:var(--glass);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
  margin-bottom:4px;
}
.empty-icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}
.empty-title{font-size:15px;font-weight:800;color:var(--text)}
.empty-desc{font-size:13px;color:var(--text-3);max-width:360px;line-height:1.5}

/* Loading spinner */
.spinner{
  width:20px;height:20px;
  border:2px solid var(--glass);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:40px;color:var(--text-3);font-size:13px;font-weight:600}

/* Auth */
#auth-screen{
  position:fixed;inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 0%, rgba(245,158,11,0.15) 0%, transparent 60%),
    var(--bg);
  z-index:150;
}
.auth-card{
  background:var(--surface-2);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:32px;
  max-width:420px;
  width:100%;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
}
.auth-logo{
  width:64px;height:64px;
  border-radius:16px;
  background:var(--primary-soft);
  border:2px solid var(--primary-glow);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
  box-shadow:0 0 40px var(--primary-glow);
}
.auth-logo img{width:60%;height:60%;object-fit:contain;border-radius:12px}
.auth-title{
  font-size:20px;
  font-weight:800;
  color:var(--text);
  text-align:center;
  letter-spacing:-0.02em;
  margin-bottom:6px;
}
.auth-sub{
  font-size:13px;
  color:var(--text-3);
  text-align:center;
  margin-bottom:24px;
  line-height:1.5;
}

/* Copy success flash */
.copied{color:var(--success)!important}

/* Status line */
.status-line{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:8px;
  background:var(--surface-3);
  border:1px solid var(--glass-border);
  font-size:12px;
  font-weight:600;
  color:var(--text-2);
  margin-bottom:16px;
}
.status-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--text-3);
  flex-shrink:0;
}
.status-dot.online{background:var(--success);box-shadow:0 0 8px var(--success)}
.status-dot.offline{background:var(--danger);box-shadow:0 0 8px var(--danger)}

/* Toggle */
.toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--divider);
}
.toggle-row:last-child{border-bottom:none}
.toggle-info{flex:1;min-width:0}
.toggle-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.toggle-desc{font-size:11px;color:var(--text-3);line-height:1.4}
.switch{
  width:44px;height:26px;
  border-radius:13px;
  background:var(--glass);
  position:relative;
  transition:background 0.2s;
  flex-shrink:0;
  border:none;
  cursor:pointer;
}
.switch::after{
  content:'';
  position:absolute;
  top:3px;left:3px;
  width:20px;height:20px;
  border-radius:50%;
  background:#fff;
  transition:transform 0.2s;
}
.switch.on{background:var(--primary)}
.switch.on::after{transform:translateX(18px)}

/* Code block */
.code{
  background:var(--bg);
  border:1px solid var(--glass-border);
  border-radius:8px;
  padding:14px 16px;
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-2);
  overflow-x:auto;
  line-height:1.6;
  white-space:pre;
  position:relative;
}
.code .copy-btn{
  position:absolute;
  top:8px;right:8px;
  padding:4px 10px;
  font-size:10px;
  font-weight:800;
  border-radius:5px;
  background:var(--surface-3);
  border:1px solid var(--glass-border);
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.code .copy-btn:hover{background:var(--glass);color:var(--text)}

/* Pagination */
.pagination{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px;
  border-top:1px solid var(--divider);
  font-size:12px;
  color:var(--text-3);
  flex-wrap:wrap;
  gap:8px;
}
.pagination-controls{display:flex;gap:6px}
.pagination-controls .btn{min-height:28px;padding:4px 12px;font-size:11px}

/* Bulk action bar */
.bulk-bar{
  position:fixed;
  bottom:24px;left:50%;
  transform:translateX(-50%);
  background:var(--surface-2);
  border:1px solid var(--primary-glow);
  border-radius:10px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  z-index:50;
  font-size:13px;
  font-weight:600;
}
.bulk-bar .count{color:var(--primary);font-weight:800}

/* Checkbox */
input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  width:16px;height:16px;
  border-radius:4px;
  border:1.5px solid var(--glass-border);
  background:var(--bg);
  cursor:pointer;
  position:relative;
  flex-shrink:0;
}
input[type="checkbox"]:checked{
  background:var(--primary);
  border-color:var(--primary);
}
input[type="checkbox"]:checked::after{
  content:'';
  position:absolute;
  left:4px;top:1px;
  width:5px;height:9px;
  border:solid #0a0c10;
  border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     AUTH SCREEN
     ═══════════════════════════════════════════════════════ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="https://foliostudios.vercel.app/icons/icon.jpg" alt="Folio">
    </div>
    <div class="auth-title">Shortlink Admin</div>
    <div class="auth-sub">Enter your admin API key to access the shortlink management console.</div>
    <form id="auth-form">
      <div class="field">
        <label class="field-label">Admin API Key</label>
        <input type="password" class="input mono" id="auth-key" placeholder="Enter admin key" autocomplete="off" spellcheck="false">
        <div class="field-hint">This is the same key used by <code class="mono">host.js</code> (ADMIN_API_KEY)</div>
      </div>
      <div class="field">
        <label class="field-label">API Base URL</label>
        <input type="url" class="input mono" id="auth-base" value="https://foliosites.vercel.app" placeholder="https://foliosites.vercel.app">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign in
      </button>
    </form>
    <div id="auth-error" class="field-error hidden"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     APP
     ═══════════════════════════════════════════════════════ -->
<div class="app hidden" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="https://foliostudios.vercel.app/icons/icon.jpg" alt="Folio">
      <div class="brand-text">
        <div class="brand-name">Shortlinks</div>
        <div class="brand-sub">Folio Admin</div>
      </div>
    </div>

    <button class="nav-item active" data-view="overview">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Overview
    </button>
    <button class="nav-item" data-view="links">
      <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Links
      <span class="badge" id="badge-links">0</span>
    </button>
    <button class="nav-item" data-view="domains">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Domains
    </button>
    <button class="nav-item" data-view="create">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Create Link
    </button>

    <div class="nav-section">System</div>
    <button class="nav-item" data-view="api">
      <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      API Reference
    </button>
    <button class="nav-item" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>

    <div style="margin-top:auto;padding-top:16px">
      <button class="nav-item" id="logout-btn" style="color:var(--danger)">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="mobile-header">
      <button id="mobile-menu-btn">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div style="font-size:14px;font-weight:800;color:var(--text)">Shortlinks</div>
    </div>

    <div id="view-content"></div>
  </main>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<script>
(function(){
  'use strict';

  // ═══════════════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════════════
  const state = {
    apiKey: '',
    apiBase: 'https://foliosites.vercel.app',
    backendBase: 'https://foliostudios.vercel.app',
    currentView: 'overview',
    links: [],
    domains: [],
    primaryDomain: 'folio.xo.je',
    loading: false,
    selectedLinks: new Set(),
    searchQuery: '',
    sortBy: 'createdAt',
    sortOrder: 'desc',
    page: 0,
    pageSize: 20,
  };

  const $ = id => document.getElementById(id);

  // ═══════════════════════════════════════════════════════
  //  API CLIENT
  // ═══════════════════════════════════════════════════════
  async function api(path, opts = {}) {
    const url = state.apiBase + path;
    const headers = {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      ...(opts.headers || {}),
    };
    try {
      const res = await fetch(url, { ...opts, headers });
      let data = null;
      try { data = await res.json(); } catch {}
      return { ok: res.ok, status: res.status, data };
    } catch (err) {
      return { ok: false, status: 0, data: { error: err.message } };
    }
  }

  // List all links (admin)
  async function fetchLinks() {
    const res = await api('/api/shortlink?action=list&limit=500');
    if (res.ok && res.data?.success) {
      state.links = res.data.links || [];
      state.domains = [];
      return true;
    }
    return false;
  }

  // Fetch supported domains
  async function fetchDomains() {
    const res = await api('/api/shortlink?action=domains');
    if (res.ok && res.data?.success) {
      state.domains = res.data.domains || [];
      state.primaryDomain = res.data.primary || 'folio.xo.je';
      return true;
    }
    return false;
  }

  async function createLink(body) {
    return api('/api/shortlink?action=create', {
      method: 'POST',
      body: JSON.stringify(body),
    });
  }

  async function claimLink(body) {
    return api('/api/shortlink?action=claim', {
      method: 'POST',
      body: JSON.stringify(body),
    });
  }

  async function editLink(body) {
    return api('/api/shortlink?action=edit', {
      method: 'POST',
      body: JSON.stringify(body),
    });
  }

  async function releaseLink(key, pid) {
    return api('/api/shortlink?action=release&key=' + encodeURIComponent(key), {
      method: 'DELETE',
      body: JSON.stringify({ pid }),
    });
  }

  async function fetchInfo(key) {
    return api('/api/shortlink?action=info&key=' + encodeURIComponent(key));
  }

  // ═══════════════════════════════════════════════════════
  //  TOAST
  // ═══════════════════════════════════════════════════════
  function toast(message, type = 'info') {
    const icons = {
      success: '<polyline points="20 6 9 17 4 12"/>',
      error: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
      warning: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
    };
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = '<svg viewBox="0 0 24 24">' + (icons[type] || icons.info) + '</svg><span>' + escapeHtml(message) + '</span>';
    $('toast-container').appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(20px)';
      setTimeout(() => el.remove(), 300);
    }, 3500);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ═══════════════════════════════════════════════════════
  //  AUTH
  // ═══════════════════════════════════════════════════════
  $('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const key = $('auth-key').value.trim();
    const base = $('auth-base').value.trim() || 'https://foliosites.vercel.app';
    if (!key) { showAuthError('Please enter an API key'); return; }

    state.apiKey = key;
    state.apiBase = base.replace(/\/$/, '');

    // Test the key by hitting the domains endpoint (no auth needed) and list (auth needed)
    $('auth-error').classList.add('hidden');
    const res = await api('/api/shortlink?action=list&limit=1');
    if (!res.ok) {
      showAuthError(res.status === 401 ? 'Invalid API key' : 'Could not connect: ' + (res.data?.error || 'network error'));
      state.apiKey = '';
      return;
    }

    try { sessionStorage.setItem('shortlink_admin_key', key); } catch {}
    try { sessionStorage.setItem('shortlink_admin_base', state.apiBase); } catch {}

    $('auth-screen').classList.add('hidden');
    $('app').classList.remove('hidden');
    await boot();
  });

  function showAuthError(msg) {
    const el = $('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  $('logout-btn').addEventListener('click', () => {
    try { sessionStorage.removeItem('shortlink_admin_key'); } catch {}
    try { sessionStorage.removeItem('shortlink_admin_base'); } catch {}
    location.reload();
  });

  // ═══════════════════════════════════════════════════════
  //  NAV
  // ═══════════════════════════════════════════════════════
  document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.currentView = btn.dataset.view;
      if (state.currentView === 'create') {
        openCreateModal();
        // Reset to previous view
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.querySelector('.nav-item[data-view="overview"]').classList.add('active');
        state.currentView = 'overview';
      } else {
        renderView();
      }
      if (window.innerWidth <= 900) $('sidebar').classList.remove('open');
    });
  });

  $('mobile-menu-btn')?.addEventListener('click', () => {
    $('sidebar').classList.toggle('open');
  });

  // ═══════════════════════════════════════════════════════
  //  VIEW ROUTER
  // ═══════════════════════════════════════════════════════
  function renderView() {
    const content = $('view-content');
    const views = {
      overview: renderOverview,
      links: renderLinks,
      domains: renderDomains,
      api: renderApi,
      settings: renderSettings,
    };
    const renderer = views[state.currentView] || renderOverview;
    content.innerHTML = '';
    try { renderer(content); } catch (err) { console.error(err); content.innerHTML = '<div class="empty"><div class="empty-title">Error</div><div class="empty-desc">' + escapeHtml(err.message) + '</div></div>'; }
  }

  // ═══════════════════════════════════════════════════════
  //  VIEW: OVERVIEW
  // ═══════════════════════════════════════════════════════
  function renderOverview(container) {
    const totalLinks = state.links.length;
    const totalClicks = state.links.reduce((sum, l) => sum + (l.clicks || 0), 0);
    const customLinks = state.links.filter(l => l.strategy === 'custom').length;
    const thisWeek = state.links.filter(l => l.createdAt && Date.now() - l.createdAt < 7 * 24 * 60 * 60 * 1000).length;

    const topLinks = [...state.links]
      .sort((a, b) => (b.clicks || 0) - (a.clicks || 0))
      .slice(0, 5);

    const recentLinks = [...state.links]
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
      .slice(0, 5);

    container.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Overview</div>
          <div class="page-sub">Your shortlink system at a glance. Live data from ${escapeHtml(state.apiBase)}</div>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary" onclick="window.dashboard.refresh()">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
          </button>
          <button class="btn btn-primary" onclick="window.dashboard.openCreate()">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New link
          </button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total links</div>
          <div class="stat-value">${totalLinks}</div>
          <div class="stat-hint">${thisWeek} added this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total clicks</div>
          <div class="stat-value">${formatNumber(totalClicks)}</div>
          <div class="stat-hint">across all links</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Custom keys</div>
          <div class="stat-value">${customLinks}</div>
          <div class="stat-hint">${totalLinks ? Math.round((customLinks / totalLinks) * 100) : 0}% of all links</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Primary domain</div>
          <div class="stat-value" style="font-size:16px;font-family:var(--font-mono);letter-spacing:-0.02em">${escapeHtml(state.primaryDomain)}</div>
          <div class="stat-hint">${state.domains.length} supported domains</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" id="overview-grid">
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
              Top links
            </div>
          </div>
          <div class="card-body tight">
            ${topLinks.length === 0
              ? '<div class="empty" style="padding:30px 16px"><div class="empty-title">No links yet</div><div class="empty-desc">Create your first link to see stats.</div></div>'
              : topLinks.map(l => `
                <div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--divider)">
                  <div style="flex:1;min-width:0">
                    <div class="mono" style="font-size:12px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(l.key)}</div>
                    <div style="font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">${escapeHtml(l.url || '')}</div>
                  </div>
                  <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:16px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums">${formatNumber(l.clicks || 0)}</div>
                    <div style="font-size:10px;color:var(--text-3)">clicks</div>
                  </div>
                </div>
              `).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Recent links
            </div>
          </div>
          <div class="card-body tight">
            ${recentLinks.length === 0
              ? '<div class="empty" style="padding:30px 16px"><div class="empty-title">No links yet</div><div class="empty-desc">Create your first link to see activity.</div></div>'
              : recentLinks.map(l => `
                <div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--divider)">
                  <div style="flex:1;min-width:0">
                    <div class="mono" style="font-size:12px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(l.key)}</div>
                    <div style="font-size:11px;color:var(--text-3);margin-top:2px">${timeAgo(l.createdAt)}</div>
                  </div>
                  <span class="chip neutral">${escapeHtml(l.strategy || 'proj')}</span>
                </div>
              `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  // ═══════════════════════════════════════════════════════
  //  VIEW: LINKS
  // ═══════════════════════════════════════════════════════
  function renderLinks(container) {
    const filtered = filterAndSortLinks();

    container.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Links</div>
          <div class="page-sub">${state.links.length} total links · ${filtered.length} matching</div>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary" onclick="window.dashboard.refresh()">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
          </button>
          <button class="btn btn-primary" onclick="window.dashboard.openCreate()">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New link
          </button>
        </div>
      </div>

      <div class="card">
        <div class="search-bar">
          <input type="text" class="input" id="link-search" placeholder="Search keys, URLs, PIDs..." value="${escapeHtml(state.searchQuery)}">
          <select class="input" id="link-strategy" style="width:auto;min-width:140px">
            <option value="">All strategies</option>
            <option value="custom" ${state.strategy === 'custom' ? 'selected' : ''}>Custom</option>
            <option value="userproj" ${state.strategy === 'userproj' ? 'selected' : ''}>User + Project</option>
            <option value="proj" ${state.strategy === 'proj' ? 'selected' : ''}>Project</option>
          </select>
          <select class="input" id="link-sort" style="width:auto;min-width:140px">
            <option value="createdAt" ${state.sortBy === 'createdAt' ? 'selected' : ''}>Newest first</option>
            <option value="clicks" ${state.sortBy === 'clicks' ? 'selected' : ''}>Most clicks</option>
            <option value="key" ${state.sortBy === 'key' ? 'selected' : ''}>Alphabetical</option>
          </select>
        </div>

        ${filtered.length === 0
          ? '<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div><div class="empty-title">' + (state.links.length === 0 ? 'No links yet' : 'No matches') + '</div><div class="empty-desc">' + (state.links.length === 0 ? 'Create your first shortlink to get started.' : 'Try a different search or filter.') + '</div></div>'
          : `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:32px"><input type="checkbox" id="select-all"></th>
                    <th>Key</th>
                    <th>Destination</th>
                    <th>Strategy</th>
                    <th>Clicks</th>
                    <th>Created</th>
                    <th style="text-align:right">Actions</th>
                  </tr>
                </thead>
                <tbody id="links-tbody">
                  ${filtered.map(link => renderLinkRow(link)).join('')}
                </tbody>
              </table>
            </div>
            <div class="pagination">
              <div>Showing ${filtered.length} of ${state.links.length} links</div>
              <div class="pagination-controls">
                <button class="btn btn-secondary btn-sm" onclick="window.dashboard.refresh()">Refresh data</button>
              </div>
            </div>
          `}
      </div>

      ${state.selectedLinks.size > 0 ? `
        <div class="bulk-bar">
          <span><span class="count">${state.selectedLinks.size}</span> selected</span>
          <button class="btn btn-danger btn-sm" onclick="window.dashboard.bulkDelete()">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            Delete selected
          </button>
          <button class="btn btn-ghost btn-sm" onclick="window.dashboard.clearSelection()">Cancel</button>
        </div>
      ` : ''}
    `;

    // Wire search
    const searchInput = $('link-search');
    if (searchInput) {
      let timer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          state.searchQuery = e.target.value;
          renderLinks(container);
        }, 200);
      });
    }

    $('link-strategy')?.addEventListener('change', (e) => {
      state.strategy = e.target.value;
      renderLinks(container);
    });

    $('link-sort')?.addEventListener('change', (e) => {
      state.sortBy = e.target.value;
      renderLinks(container);
    });

    $('select-all')?.addEventListener('change', (e) => {
      if (e.target.checked) {
        filtered.forEach(l => state.selectedLinks.add(l.key));
      } else {
        state.selectedLinks.clear();
      }
      renderLinks(container);
    });

    // Wire row actions
    container.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        const key = btn.dataset.key;
        if (action === 'copy') {
          copyToClipboard('https://' + state.primaryDomain + '/' + key, 'Link copied');
        } else if (action === 'open') {
          window.open('https://' + state.primaryDomain + '/' + key, '_blank', 'noopener');
        } else if (action === 'edit') {
          openEditModal(key);
        } else if (action === 'delete') {
          confirmDelete(key);
        }
      });
    });

    container.querySelectorAll('[data-check]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        if (e.target.checked) state.selectedLinks.add(e.target.dataset.check);
        else state.selectedLinks.delete(e.target.dataset.check);
        renderLinks(container);
      });
    });
  }

  function filterAndSortLinks() {
    let list = [...state.links];

    if (state.searchQuery) {
      const q = state.searchQuery.toLowerCase();
      list = list.filter(l =>
        (l.key || '').toLowerCase().includes(q) ||
        (l.url || '').toLowerCase().includes(q) ||
        (l.pid || '').toLowerCase().includes(q)
      );
    }

    if (state.strategy) {
      list = list.filter(l => l.strategy === state.strategy);
    }

    if (state.sortBy === 'createdAt') {
      list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    } else if (state.sortBy === 'clicks') {
      list.sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
    } else if (state.sortBy === 'key') {
      list.sort((a, b) => (a.key || '').localeCompare(b.key || ''));
    }

    return list;
  }

  async function submitCreate() {
    const pid = $('create-pid').value.trim();
    const url = $('create-url').value.trim();
    const key = $('create-key').value.trim().toLowerCase();

    if (!pid || !url) {
      showFieldError('create-error', 'PID and URL are required');
      return;
    }

    if (!/^https:\/\//i.test(url)) {
      showFieldError('create-error', 'URL must start with https://');
      return;
    }

    if (key && !/^[a-z][a-z0-9]{2,29}$/.test(key)) {
      showFieldError('create-error', 'Key must be 3-30 chars, lowercase letters + digits, starting with a letter');
      return;
    }

    const btn = $('create-submit');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px"></div>';

    try {
      let res;
      if (key) {
        res = await claimLink({ pid, url, baseName: key, strategy: 'custom', confirmed: false });
        if (res.status === 409 && res.data?.suggestions?.length) {
          // Show suggestions
          const suggestions = res.data.suggestions;
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Create';
          const modal = $('modal-content');
          const body = modal.querySelector('.modal-body');
          body.innerHTML = `
            <div style="background:var(--warning-soft);border:1px solid rgba(217,119,6,0.3);padding:16px;border-radius:10px;margin-bottom:16px">
              <div style="font-size:13px;font-weight:700;color:var(--warning);margin-bottom:4px">"${escapeHtml(key)}" is already taken</div>
              <div style="font-size:12px;color:var(--text-2);line-height:1.5">Here are the next available keys:</div>
            </div>
            ${suggestions.map(s => `
              <button class="btn btn-secondary" style="width:100%;margin-bottom:8px;justify-content:space-between" onclick="window.dashboard.useSuggestion('${escapeHtml(pid)}', '${escapeHtml(url)}', '${escapeHtml(s)}')">
                <span class="mono">${escapeHtml(s)}</span>
                <span style="font-size:11px;color:var(--text-3)">Use this →</span>
              </button>
            `).join('')}
          `;
          const footer = modal.querySelector('.modal-footer');
          footer.innerHTML = '<button class="btn btn-secondary" onclick="window.dashboard.closeModal()">Cancel</button>';
          return;
        }
      } else {
        res = await createLink({ pid, url });
      }

      if (!res.ok || !res.data?.success) {
        showFieldError('create-error', res.data?.error || 'Failed to create link');
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Create';
        return;
      }

      toast('Link created: ' + res.data.key, 'success');
      closeModal();
      await refresh();
    } catch (err) {
      showFieldError('create-error', err.message);
      btn.disabled = false;
      btn.innerHTML = 'Create';
    }
  }

  async function useSuggestion(pid, url, suggestedKey) {
    const btn = $('create-submit');
    const res = await claimLink({ pid, url, baseName: suggestedKey.replace(/[0-9]+$/, ''), strategy: 'custom', confirmed: true });
    if (res.ok && res.data?.success) {
      toast('Link created: ' + res.data.key, 'success');
      closeModal();
      await refresh();
    } else {
      toast(res.data?.error || 'Failed to create link', 'error');
    }
  }

  async function submitEdit(link) {
    const newKey = $('edit-key').value.trim().toLowerCase();
    if (!newKey || newKey === link.key) {
      showFieldError('edit-error', 'Enter a different key');
      return;
    }
    if (!/^[a-z][a-z0-9]{2,29}$/.test(newKey)) {
      showFieldError('edit-error', 'Invalid key format');
      return;
    }

    const btn = $('edit-submit');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px"></div>';

    const res = await editLink({
      pid: link.pid,
      newName: newKey,

    if (res.status === 409 && res.data?.suggestions?.length) {
      const modal = $('modal-content');
      const body = modal.querySelector('.modal-body');
      body.innerHTML = `

        </div>

      return;
    }

    if (!res.ok || !res.data?.success) {
      showFieldError('edit-error', res.data?.error || 'Failed to edit');
      btn.disabled = false;
      btn.innerHTML = 'Save';
      return;
    }

    toast('Link renamed to: ' + res.data.key, 'success');
    closeModal();
    await refresh();
  }

          <div class="modal-title">Delete link</div>
          <button class="modal-close" onclick="window.dashboard.closeModal()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div style="display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--danger-soft);border:1px solid rgba(239,68,68,0.3);border-radius:10px;margin-bottom:16px">
            <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:var(--danger);fill:none;stroke-width:2.4;flex-shrink:0;margin-top:1px">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <div>
              <div style="font-size:13px;font-weight:700;color:var(--danger);margin-bottom:4px">Delete this link?</div>
              <div style="font-size:12px;color:var(--text-2);line-height:1.5">The short link <code class="mono" style="background:var(--bg);padding:2px 6px;border-radius:4px">${escapeHtml(key)}</code> will stop working. This cannot be undone.</div>
            </div>
          </div>
          <div class="code" style="padding:10px 14px">https://${escapeHtml(state.primaryDomain)}/${escapeHtml(key)}</div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="window.dashboard.closeModal()">Cancel</button>
          <button class="btn btn-danger" id="delete-confirm-btn" onclick="window.dashboard.doDelete('${escapeHtml(key)}', ${JSON.stringify(link.pid)})">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            Delete
          </button>
        </div>
      `;
      $('modal-overlay').classList.add('active');
    }
  }

  async function doDelete(key, pid) {
    const btn = $('delete-confirm-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px"></div>';

    const res = await releaseLink(key, pid);
    if (res.ok && res.data?.success) {
      toast('Link deleted: ' + key, 'success');
      closeModal();
      await refresh();
    } else {
      toast(res.data?.error || 'Failed to delete', 'error');
      btn.disabled = false;
      btn.innerHTML = 'Delete';
    }
  }

  async function bulkDelete() {
    const keys = Array.from(state.selectedLinks);
    if (!confirm('Delete ' + keys.length + ' link(s)? This cannot be undone.')) return;

    let success = 0;
    let failed = 0;
    for (const key of keys) {
      const link = state.links.find(l => l.key === key);
      if (!link) continue;
      const res = await releaseLink(key, link.pid);
      if (res.ok && res.data?.success) success++;
      else failed++;
    }

    state.selectedLinks.clear();
    if (success > 0) toast('Deleted ' + success + ' link(s)' + (failed > 0 ? ', ' + failed + ' failed' : ''), success > failed ? 'success' : 'warning');
    else toast('No links deleted', 'error');
    await refresh();
  }

  // ═══════════════════════════════════════════════════════
  //  HELPERS
  // ═══════════════════════════════════════════════════════
  function showFieldError(id, msg) {
    const el = $(id);
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 5000);
  }

  function closeModal() {
    $('modal-overlay').classList.remove('active');
    $('modal-content').innerHTML = '';
  }

  $('modal-overlay')?.addEventListener('click', (e) => {
    if (e.target === $('modal-overlay')) closeModal();
  });

  function formatNumber(n) {
    if (n == null) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n);
  }

  function timeAgo(ts) {
    if (!ts) return '—';
    const diff = Date.now() - ts;
    if (diff < 60000) return 'just now';
    const m = Math.floor(diff / 60000);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h / 24);
    if (d < 30) return d + 'd ago';
    return new Date(ts).toLocaleDateString();
  }

  function copyToClipboard(text, message) {
    try {
      navigator.clipboard.writeText(text);
      toast(message || 'Copied', 'success');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      toast(message || 'Copied', 'success');
    }
  }

  // ═══════════════════════════════════════════════════════
  //  BOOT
  // ═══════════════════════════════════════════════════════
  async function refresh() {
    state.loading = true;
    await Promise.all([fetchLinks(), fetchDomains()]);
    state.loading = false;
    $('badge-links').textContent = state.links.length;
    renderView();
  }

  async function boot() {
    await refresh();
    renderView();
  }

  // ═══════════════════════════════════════════════════════
  //  PUBLIC API (window.dashboard)
  // ═══════════════════════════════════════════════════════
  window.dashboard = {
    refresh: async () => {
      await fetchLinks();
      await fetchDomains();
      $('badge-links').textContent = state.links.length;
      renderView();
    },
    refreshDomains: async () => {
      await fetchDomains();
      renderView();
    },
    openCreate: () => openCreateModal(),
    closeModal,
    confirmDelete,
    doDelete,
    bulkDelete,
    useSuggestion,
    clearSelection: () => { state.selectedLinks.clear(); renderView(); },
    copyToClipboard,
    logout: () => {
      try { sessionStorage.removeItem('shortlink_admin_key'); } catch {}
      try { sessionStorage.removeItem('shortlink_admin_base'); } catch {}
      location.reload();
    },
    saveSettings: () => {
      const base = $('settings-base').value.trim().replace(/\/$/, '');
      const backend = $('settings-backend').value.trim().replace(/\/$/, '');
      if (base) { state.apiBase = base; try { sessionStorage.setItem('shortlink_admin_base', base); } catch {} }
      if (backend) { state.backendBase = backend; }
      toast('Settings saved', 'success');
    },
  };

  // ═══════════════════════════════════════════════════════
  //  AUTO-LOGIN
  // ═══════════════════════════════════════════════════════
  (async function tryAutoLogin() {
    let savedKey = null, savedBase = null;
    try { savedKey = sessionStorage.getItem('shortlink_admin_key'); } catch {}
    try { savedBase = sessionStorage.getItem('shortlink_admin_base'); } catch {}

    if (savedKey) {
      state.apiKey = savedKey;
      state.apiBase = savedBase || 'https://foliosites.vercel.app';

      const res = await api('/api/shortlink?action=list&limit=1');
      if (res.ok) {
        $('auth-screen').classList.add('hidden');
        $('app').classList.remove('hidden');
        await boot();
        return;
      }
      try { sessionStorage.removeItem('shortlink_admin_key'); } catch {}
    }
  })();

})();
</script>

</body>
</html>
